[package]
name = "randomx-rs"
description = "Rust bindings for the RandomX Proof-of-Work"
authors = ["The Tari Development Community"]
repository = "https://github.com/tari-project/randomx-rs"
homepage = "https://tari.com"
readme = "README.md"
license = "BSD-3-Clause"
version = "1.3.2"
edition = "2018"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# Create a dynamic library for C usage and a rust library so it can be called from rust
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2.121"
bitflags = "1.3.2"
thiserror = "1.0.30"
wasm-bindgen = "0.2.89"
js-sys = "0.3.66"
web-sys = { version = "0.3.66", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.89"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
hex = "0.4.3"
quickcheck = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
